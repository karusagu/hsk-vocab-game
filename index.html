<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK 1-4 Vocabulary Quiz - Complete 1,200 Words</title>
  <style>
    :root {
      --primary: #667eea;
      --secondary: #764ba2;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      min-height: 100vh;
    }

    .app-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .quiz-container {
      flex: 1;
      padding: 40px 20px;
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
      color: white;
    }

    .quiz-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .quiz-subtitle {
      font-size: 1rem;
      opacity: 0.95;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .quiz-btn, .quiz-type-btn, .return-btn {
      background: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .quiz-btn:hover, .quiz-type-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px rgba(0,0,0,0.1);
    }

    .question-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 700px;
      margin: 0 auto 30px;
      box-shadow: 0 20px 25px rgba(0,0,0,0.1);
    }

    .question-number {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .pinyin-text {
      font-size: 2rem;
      color: var(--secondary);
      text-align: center;
      margin-bottom: 20px;
      font-style: italic;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .character-meaning {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 1.1rem;
    }

    .options-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 30px 0;
    }

    .option-btn {
      background: #f3f4f6;
      border: 3px solid #e5e7eb;
      border-radius: 12px;
      padding: 25px;
      font-size: 1.8rem;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--primary);
    }

    .option-btn:hover:not(:disabled) {
      background: #e5e7eb;
      transform: scale(1.02);
      border-color: var(--primary);
    }

    .option-btn.correct {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .option-btn.incorrect {
      background: var(--error);
      border-color: var(--error);
      color: white;
    }

    .option-btn.disabled {
      cursor: not-allowed;
      opacity: 0.7;
      pointer-events: none;
    }

    .progress-container {
      max-width: 700px;
      margin: 0 auto 20px;
    }

    .progress-bar {
      background: rgba(255,255,255,0.3);
      border-radius: 10px;
      height: 8px;
      overflow: hidden;
    }

    .progress-fill {
      background: white;
      height: 100%;
      transition: width 0.3s ease;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      color: white;
    }

    .feedback-message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-weight: 600;
      text-align: center;
    }

    .feedback-correct {
      background: #d1fae5;
      color: #065f46;
    }

    .feedback-incorrect {
      background: #fee2e2;
      color: #991b1b;
    }

    .next-btn, .finish-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
      transition: all 0.3s ease;
    }

    .finish-btn {
      background: var(--warning);
      margin-top: 12px;
    }

    .next-btn:hover:not(:disabled), .finish-btn:hover {
      transform: translateY(-2px);
    }

    .next-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .results-container {
      background: white;
      border-radius: 16px;
      padding: 60px 40px;
      max-width: 600px;
      margin: 40px auto;
      text-align: center;
    }

    .score-circle {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      color: white;
      font-size: 3rem;
      font-weight: bold;
    }

    .hidden {
      display: none !important;
    }

    .quiz-type-selector {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .quiz-type-selector button {
      width: 100%;
      margin-bottom: 16px;
    }

    .mistake-item {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      margin-bottom: 8px;
      text-align: left;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
    }

    .button-group {
      display: flex;
      gap: 12px;
    }

    .fill-blank-input {
      width: 100%;
      padding: 16px;
      font-size: 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-family: inherit;
      margin-bottom: 16px;
    }

    .fill-blank-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .fill-blank-input.correct {
      border-color: var(--success);
      background: #d1fae5;
    }

    .fill-blank-input.incorrect {
      border-color: var(--error);
      background: #fee2e2;
    }

    @media (max-width: 640px) {
      .quiz-title { font-size: 1.5rem; }
      .question-card { padding: 24px; }
      .option-btn { font-size: 1.2rem; padding: 16px; }
      .options-container { gap: 12px; }
      .pinyin-text { font-size: 1.5rem; }
      .menu-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    }
  </style>
</head>

    </div>
  </div>

  <script>
    // Function to add tone marks to pinyin with tone numbers
    function addToneMarks(pinyin) {
      if (!pinyin) return '';
      
      const toneMarks = {
        'a1': 'ā', 'a2': 'á', 'a3': 'ǎ', 'a4': 'à',
        'e1': 'ē', 'e2': 'é', 'e3': 'ě', 'e4': 'è',
        'i1': 'ī', 'i2': 'í', 'i3': 'ǐ', 'i4': 'ì',
        'o1': 'ō', 'o2': 'ó', 'o3': 'ǒ', 'o4': 'ò',
        'u1': 'ū', 'u2': 'ú', 'u3': 'ǔ', 'u4': 'ù',
        'v1': 'ǖ', 'v2': 'ǘ', 'v3': 'ǚ', 'v4': 'ǜ',
        'ü1': 'ǖ', 'ü2': 'ǘ', 'ü3': 'ǚ', 'ü4': 'ǜ'
      };
      
      let result = pinyin;
      result = result.replace(/v/g, 'ü');
      
      result = result.replace(/([a-zü]+)([1-5])/g, (match, syllable, toneNum) => {
        if (toneNum === '5') return syllable;
        
        const vowelOrder = ['a', 'e', 'o', 'i', 'u', 'ü'];
        let targetVowel = '';
        let targetIndex = -1;
        
        if (syllable.includes('iu')) {
          const uIndex = syllable.indexOf('u');
          if (uIndex > syllable.indexOf('i')) {
            targetVowel = 'u';
            targetIndex = uIndex;
          } else {
            targetVowel = 'i';
            targetIndex = syllable.indexOf('i');
          }
        } else if (syllable.includes('ui')) {
          const iIndex = syllable.indexOf('i');
          if (iIndex > syllable.indexOf('u')) {
            targetVowel = 'i';
            targetIndex = iIndex;
          } else {
            targetVowel = 'u';
            targetIndex = syllable.indexOf('u');
          }
        } else {
          for (let vowel of vowelOrder) {
            const idx = syllable.indexOf(vowel);
            if (idx !== -1) {
              targetVowel = vowel;
              targetIndex = idx;
              break;
            }
          }
        }
        
        if (targetVowel !== '') {
          const key = targetVowel + toneNum;
          const markedVowel = toneMarks[key] || targetVowel;
          return syllable.substring(0, targetIndex) + markedVowel + syllable.substring(targetIndex + 1);
        }
        
        return syllable;
      });
      
      return result;
    }

      allVocab.forEach((vocab) => {
        for (let i = 0; i < vocab.chinese.length; i++) {
          const char = vocab.chinese[i];
          if (!uniqueChars.has(char)) {
            const rawPinyin = characterPinyinMap[char] || char;
            const pinyinWithTones = addToneMarks(rawPinyin);
            uniqueChars.set(char, {
              character: char,
              pinyin: pinyinWithTones,
              meaning: ""
            });
          }
        }
      });
      
      console.log("Total unique characters extracted:", uniqueChars.size);
      return Array.from(uniqueChars.values());
    }
    
    function getDistractorCharacter(correctChar, charactersList) {
      const candidates = charactersList.filter(c => c.character !== correctChar);
      if (candidates.length === 0) return { character: "?", pinyin: "?", meaning: "" };
      return candidates[Math.floor(Math.random() * candidates.length)];
    }
    
    function createCharacterIdentificationQuestions() {
      const uniqueCharacters = extractUniqueCharacters();
      const questions = [];
      
      uniqueCharacters.forEach(charData => {
        if (charData.character && charData.pinyin) {
          const distractor = getDistractorCharacter(charData.character, uniqueCharacters);
          const options = [charData.character, distractor.character];
          const shuffledOptions = shuffleArray([...options]);
          
          questions.push({
            correctChar: charData.character,
            pinyin: charData.pinyin,
            meaning: charData.meaning,
            options: shuffledOptions,
            correctIndex: shuffledOptions.indexOf(charData.character)
          });
        }
      });
      
      return shuffleArray(questions);
    }

    function createQuizMenu() {
      const menu = document.getElementById('quizMenu');
      menu.innerHTML = '';
      const totalQuizzes = Math.ceil(allVocab.length / 30);
      
      for (let i = 1; i <= totalQuizzes; i++) {
        const startWord = (i - 1) * 30;
        const endWord = Math.min(i * 30, allVocab.length);
        const btn = document.createElement('button');
        btn.className = 'quiz-btn';
        btn.innerHTML = `Quiz ${i}<br><span style="font-size: 0.7rem; color: #999;">Words ${startWord + 1}-${endWord}</span>`;
        btn.onclick = () => {
          gameState.currentQuiz = i;
          document.getElementById('mainMenu').classList.add('hidden');
          document.getElementById('quizTypeSelector').classList.remove('hidden');
        };
        menu.appendChild(btn);
      }
    }

    function resetGameState() {
      gameState = {
        currentQuiz: null,
        currentMode: null,
        questions: [],
        currentIndex: 0,
        score: 0,
        mistakes: [],
        answered: false,
        totalQuestions: 0,
        comparingQuestions: []
      };
    }

    function startQuiz(mode) {
      gameState.currentMode = mode;
      gameState.currentIndex = 0;
      gameState.score = 0;
      gameState.mistakes = [];
      gameState.answered = false;
      
      if (mode === 'character-identification') {
        const identificationQuestions = createCharacterIdentificationQuestions();
        gameState.questions = identificationQuestions;
        gameState.totalQuestions = gameState.questions.length;
      } else {
        const startIdx = (gameState.currentQuiz - 1) * 30;
        const endIdx = Math.min(startIdx + 30, allVocab.length);
        let selected = allVocab.slice(startIdx, endIdx);
        selected = shuffleArray([...selected]);
        gameState.questions = selected.map(q => ({ ...q }));
        gameState.totalQuestions = gameState.questions.length;
        
        if (mode === 'multiple-choice') {
          gameState.questions = gameState.questions.map(q => ({
            ...q,
            options: shuffleArray([q.chinese, ...getRandomDistractors(q.chinese, 3)])
          }));
        } else if (mode === 'character-comparison') {
          gameState.comparingQuestions = gameState.questions.map(q => {
            const wrongOption = getRandomDistractors(q.chinese, 1)[0];
            const options = shuffleArray([q.chinese, wrongOption]);
            return {
              question: q,
              optionA: options[0],
              optionB: options[1],
              correctIndex: options.indexOf(q.chinese)
            };
          });
        }
      }
      
      document.getElementById('quizTypeSelector').classList.add('hidden');
      document.getElementById('resultsScreen').classList.add('hidden');
      document.getElementById('quizScreen').classList.remove('hidden');
      document.getElementById('questionCounter').innerHTML = `Question 1 of ${gameState.totalQuestions}`;
      document.getElementById('questionNumber').innerHTML = `Question 1 of ${gameState.totalQuestions}`;
      
      showQuestion();
    }

    function showQuestion() {
      gameState.answered = false;
      const progress = (gameState.currentIndex / gameState.totalQuestions) * 100;
      document.getElementById('progressFill').style.width = `${progress}%`;
      document.getElementById('feedbackMessage').innerHTML = '';
      document.getElementById('feedbackMessage').className = 'feedback-message';
      document.getElementById('nextBtn').disabled = true;
      document.getElementById('scoreCounter').innerHTML = gameState.score;
      
      if (gameState.currentMode === 'character-identification') {
        showCharacterIdentificationQuestion();
      } else if (gameState.currentMode === 'multiple-choice') {
        showMultipleChoiceQuestion();
      } else if (gameState.currentMode === 'fill-blank') {
        showFillBlankQuestion();
      } else if (gameState.currentMode === 'character-comparison') {
        showCharacterComparisonQuestion();
      }
    }

    function showCharacterIdentificationQuestion() {
      const question = gameState.questions[gameState.currentIndex];
      document.getElementById('pinyinText').innerHTML = question.pinyin;
      document.getElementById('characterMeaning').innerHTML = 'Select the correct Chinese character:';
      
      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      container.className = 'options-container';
      
      question.options.forEach((option, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = option;
        btn.onclick = () => handleCharacterIdentificationAnswer(idx, question);
        container.appendChild(btn);
      });
    }

    function handleCharacterIdentificationAnswer(selectedIndex, question) {
      if (gameState.answered) return;
      gameState.answered = true;
      
      const isCorrect = selectedIndex === question.correctIndex;
      const selectedChar = question.options[selectedIndex];
      const correctChar = question.options[question.correctIndex];
      
      if (isCorrect) {
        gameState.score++;
      } else {
        gameState.mistakes.push({
          pinyin: question.pinyin,
          userAnswer: selectedChar,
          correctAnswer: correctChar
        });
      }
      
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, idx) => {
        btn.classList.add('disabled');
        if (idx === question.correctIndex) {
          btn.classList.add('correct');
        } else if (idx === selectedIndex && !isCorrect) {
          btn.classList.add('incorrect');
        }
      });
      
      const feedback = document.getElementById('feedbackMessage');
      feedback.className = isCorrect ? 'feedback-message feedback-correct' : 'feedback-message feedback-incorrect';
      feedback.innerHTML = isCorrect ? '✓ Correct!' : `✗ Incorrect. The correct character is: ${correctChar}`;
      
      document.getElementById('nextBtn').disabled = false;
      document.getElementById('scoreCounter').innerHTML = gameState.score;
    }

    function showMultipleChoiceQuestion() {
      const question = gameState.questions[gameState.currentIndex];
      document.getElementById('pinyinText').innerHTML = addToneMarks(question.pinyin);
      document.getElementById('characterMeaning').innerHTML = `Meaning: ${question.english}`;
      
      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      container.className = 'options-container';
      
      question.options.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = option;
        btn.onclick = () => handleMultipleChoiceAnswer(option, question.chinese);
        container.appendChild(btn);
      });
    }

    function handleMultipleChoiceAnswer(selected, correct) {
      if (gameState.answered) return;
      gameState.answered = true;
      
      const isCorrect = selected === correct;
      if (isCorrect) {
        gameState.score++;
      } else {
        gameState.mistakes.push({
          pinyin: gameState.questions[gameState.currentIndex].pinyin,
          meaning: gameState.questions[gameState.currentIndex].english,
          userAnswer: selected,
          correctAnswer: correct
        });
      }
      
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => {
        if (btn.textContent === correct) btn.classList.add('correct');
        else if (btn.textContent === selected && !isCorrect) btn.classList.add('incorrect');
        btn.classList.add('disabled');
      });
      
      const feedback = document.getElementById('feedbackMessage');
      feedback.className = isCorrect ? 'feedback-message feedback-correct' : 'feedback-message feedback-incorrect';
      feedback.innerHTML = isCorrect ? '✓ Correct! Well done!' : `✗ Incorrect. The answer is: ${correct}`;
      
      document.getElementById('nextBtn').disabled = false;
      document.getElementById('scoreCounter').innerHTML = gameState.score;
    }

    function showFillBlankQuestion() {
      const question = gameState.questions[gameState.currentIndex];
      document.getElementById('pinyinText').innerHTML = addToneMarks(question.pinyin);
      document.getElementById('characterMeaning').innerHTML = `Meaning: ${question.english}`;
      
      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      container.className = '';
      
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'fill-blank-input';
      input.placeholder = 'Type the Chinese characters here...';
      input.id = 'fillBlankInput';
      
      const submitBtn = document.createElement('button');
      submitBtn.className = 'quiz-btn';
      submitBtn.textContent = 'Submit Answer';
      submitBtn.style.width = '100%';
      submitBtn.style.marginTop = '0';
      submitBtn.onclick = () => handleFillBlankAnswer();
      
      container.appendChild(input);
      container.appendChild(submitBtn);
      
      setTimeout(() => document.getElementById('fillBlankInput')?.focus(), 100);
    }

    function handleFillBlankAnswer() {
      if (gameState.answered) return;
      
      const input = document.getElementById('fillBlankInput');
      if (!input) return;
      
      const userAnswer = input.value.trim();
      const currentQ = gameState.questions[gameState.currentIndex];
      const correct = currentQ.chinese;
      
      if (!userAnswer) {
        document.getElementById('feedbackMessage').className = 'feedback-message feedback-incorrect';
        document.getElementById('feedbackMessage').innerHTML = 'Please enter an answer';
        return;
      }
      
      gameState.answered = true;
      const isCorrect = userAnswer === correct;
      
      if (isCorrect) {
        gameState.score++;
        input.classList.add('correct');
        document.getElementById('feedbackMessage').className = 'feedback-message feedback-correct';
        document.getElementById('feedbackMessage').innerHTML = '✓ Correct! Well done!';
      } else {
        input.classList.add('incorrect');
        gameState.mistakes.push({
          pinyin: currentQ.pinyin,
          meaning: currentQ.english,
          userAnswer: userAnswer,
          correctAnswer: correct
        });
        document.getElementById('feedbackMessage').className = 'feedback-message feedback-incorrect';
        document.getElementById('feedbackMessage').innerHTML = `✗ Incorrect. The answer is: ${correct}`;
      }
      
      input.disabled = true;
      document.getElementById('nextBtn').disabled = false;
      document.getElementById('scoreCounter').innerHTML = gameState.score;
    }

    function showCharacterComparisonQuestion() {
      const compData = gameState.comparingQuestions[gameState.currentIndex];
      document.getElementById('pinyinText').innerHTML = addToneMarks(compData.question.pinyin);
      document.getElementById('characterMeaning').innerHTML = `Meaning: ${compData.question.english}`;
      
      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      container.className = 'options-container';
      
      const optionA = document.createElement('button');
      optionA.className = 'option-btn';
      optionA.textContent = compData.optionA;
      optionA.onclick = () => handleComparisonAnswer(0, compData);
      
      const optionB = document.createElement('button');
      optionB.className = 'option-btn';
      optionB.textContent = compData.optionB;
      optionB.onclick = () => handleComparisonAnswer(1, compData);
      
      container.appendChild(optionA);
      container.appendChild(optionB);
    }

    function handleComparisonAnswer(selectedIndex, compData) {
      if (gameState.answered) return;
      gameState.answered = true;
      
      const isCorrect = selectedIndex === compData.correctIndex;
      const correctChar = compData.correctIndex === 0 ? compData.optionA : compData.optionB;
      
      if (isCorrect) {
        gameState.score++;
      } else {
        gameState.mistakes.push({
          pinyin: compData.question.pinyin,
          meaning: compData.question.english,
          userAnswer: selectedIndex === 0 ? compData.optionA : compData.optionB,
          correctAnswer: correctChar
        });
      }
      
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, idx) => {
        btn.classList.add('disabled');
        if (idx === compData.correctIndex) btn.classList.add('correct');
        else if (idx === selectedIndex && !isCorrect) btn.classList.add('incorrect');
      });
      
      const feedback = document.getElementById('feedbackMessage');
      feedback.className = isCorrect ? 'feedback-message feedback-correct' : 'feedback-message feedback-incorrect';
      feedback.innerHTML = isCorrect ? '✓ Correct! Well done!' : `✗ Incorrect. The answer is: ${correctChar}`;
      
      document.getElementById('nextBtn').disabled = false;
      document.getElementById('scoreCounter').innerHTML = gameState.score;
    }

    function nextQuestion() {
      gameState.currentIndex++;
      if (gameState.currentIndex < gameState.totalQuestions) {
        document.getElementById('questionCounter').innerHTML = `Question ${gameState.currentIndex + 1} of ${gameState.totalQuestions}`;
        document.getElementById('questionNumber').innerHTML = `Question ${gameState.currentIndex + 1} of ${gameState.totalQuestions}`;
        showQuestion();
      } else {
        showResults();
      }
    }

    function finishQuizEarly() {
      showResults();
    }

    function showResults() {
      document.getElementById('quizScreen').classList.add('hidden');
      document.getElementById('resultsScreen').classList.remove('hidden');
      
      const percentage = (gameState.score / gameState.totalQuestions) * 100;
      document.getElementById('finalScore').innerHTML = `${gameState.score}/${gameState.totalQuestions}`;
      
      let message = '';
      if (percentage === 100) message = 'Perfect! You mastered this quiz! 🎉';
      else if (percentage >= 80) message = 'Excellent! Great job! 🌟';
      else if (percentage >= 60) message = 'Good! Keep practicing! 💪';
      else message = 'Keep practicing! Try this quiz again! 📚';
      
      document.getElementById('scoreMessage').innerHTML = message;
    }

    function reviewMistakes() {
      const modal = document.getElementById('reviewModal');
      const list = document.getElementById('mistakesList');
      
      if (gameState.mistakes.length === 0) {
        list.innerHTML = '<p style="text-align: center; color: green;">🎉 No mistakes! Perfect score!</p>';
      } else {
        list.innerHTML = gameState.mistakes.map((m, idx) => `
          <div class="mistake-item">
            <strong>Question ${idx + 1}:</strong><br>
            Pinyin: ${m.pinyin}<br>
            ${m.meaning ? `Meaning: ${m.meaning}<br>` : ''}
            <span style="color: red;">Your answer: ${m.userAnswer}</span><br>
            <span style="color: green;">✓ Correct: ${m.correctAnswer}</span>
          </div>
        `).join('');
      }
      
      modal.classList.add('active');
    }

    function returnToMenu() {
      resetGameState();
      
      document.getElementById('quizScreen').classList.add('hidden');
      document.getElementById('resultsScreen').classList.add('hidden');
      document.getElementById('quizTypeSelector').classList.add('hidden');
      document.getElementById('mainMenu').classList.remove('hidden');
      
      document.getElementById('optionsContainer').innerHTML = '';
      document.getElementById('feedbackMessage').innerHTML = '';
      document.getElementById('pinyinText').innerHTML = '';
      document.getElementById('characterMeaning').innerHTML = '';
    }

    // Event Listeners
    document.getElementById('multipleChoiceBtn').onclick = () => startQuiz('multiple-choice');
    document.getElementById('fillBlankBtn').onclick = () => startQuiz('fill-blank');
    document.getElementById('characterComparisonBtn').onclick = () => startQuiz('character-comparison');
    document.getElementById('characterIdentificationBtn').onclick = () => startQuiz('character-identification');
    document.getElementById('backToMenuBtn').onclick = returnToMenu;
    document.getElementById('returnBtn').onclick = returnToMenu;
    document.getElementById('resultsReturnBtn').onclick = returnToMenu;
    document.getElementById('nextBtn').onclick = nextQuestion;
    document.getElementById('finishBtn').onclick = finishQuizEarly;
    document.getElementById('reviewMistakesBtn').onclick = reviewMistakes;
    document.getElementById('closeModalBtn').onclick = () => document.getElementById('reviewModal').classList.remove('active');
    
    createQuizMenu();
    
    console.log("Game initialized with", allVocab.length, "total vocabulary words");
    console.log("HSK 1-3 words:", hsk1_3Vocab.length);
    console.log("HSK 4 words:", hsk4Vocab.length);
  </script>
